apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ${POSTGRES_STORAGE_CLASS}
  resources:
    requests:
      storage: ${POSTGRES_STORAGE_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  replicas: 1
  # Never run two Postgres pods on the same ReadWriteOnce volume (the default
  # RollingUpdate starts the new pod before the old one stops).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: personal-spending-tracker
    spec:
      restartPolicy: Always
      # Start as the postgres user so docker-entrypoint.sh runs Postgres
      # directly instead of going through gosu, which hung at 100% CPU after a
      # node restart (issue #101). 70 = alpine images, 999 = Debian images.
      securityContext:
        runAsUser: ${POSTGRES_UID}
        runAsGroup: ${POSTGRES_UID}
      initContainers:
        # A new local-path volume is created owned by root; Postgres refuses a
        # data directory it does not own. Runs as root, once per pod start.
        - name: postgres-data-owner
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - chown ${POSTGRES_UID}:${POSTGRES_UID} /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spending-tracker-secrets
                  key: DATABASE_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # Up to 5 minutes to start (e.g. crash recovery after a power cut)
          # before Kubernetes restarts the container.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
          # After startup, restart a Postgres that stops responding for 2 minutes.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
