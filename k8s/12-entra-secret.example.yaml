# Example only; never commit a real value. deploy-k3s.sh does not apply this
# file. Create the Secret on the node as shown in docs/entra-auth.md, which
# keeps the value out of files, shell history and process arguments.
#
# Only the client secret goes here. ENTRA_CLIENT_ID and the other Entra
# settings are not secret and belong in the ConfigMap; a second copy here
# could override them (Stock Ticker's envFrom collision, #299).
apiVersion: v1
kind: Secret
metadata:
  name: spending-tracker-entra
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  ENTRA_CLIENT_SECRET: replace-with-the-spending-tracker-app-secret-value
