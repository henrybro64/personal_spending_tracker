apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: spending-tracker
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: personal-spending-tracker
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/personal-spending-tracker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: spending-tracker
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30081

