apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: personal-spending-tracker
    spec:
      restartPolicy: Always
      initContainers:
        - name: batch-dir-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /app/batch/data /app/batch/pdf /app/batch/text
          volumeMounts:
            - name: batch-data
              mountPath: /app/batch
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: ${APP_IMAGE_PULL_POLICY}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: APP_ENV
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_NAME
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spending-tracker-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: UPLOAD_DIR
            - name: BATCH_DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: BATCH_DATA_DIR
            - name: BATCH_PDF_SOURCE_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: BATCH_PDF_SOURCE_DIR
            - name: BATCH_TEXT_SOURCE_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: BATCH_TEXT_SOURCE_DIR
            - name: USD_TWD_EXCHANGE_RATE
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: USD_TWD_EXCHANGE_RATE
            - name: AUDIT_LOG_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: AUDIT_LOG_RETENTION_DAYS
            - name: STATEMENT_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: STATEMENT_RETENTION_DAYS
            - name: PDF_PARSE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: PDF_PARSE_TIMEOUT_SECONDS
            - name: LLM_SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: spending-tracker-secrets
                  key: LLM_SETTINGS_ENCRYPTION_KEY
            # Microsoft Entra sign-in and cookie settings (#100). Explicit keys,
            # not envFrom, so no Secret can override a ConfigMap value.
            - name: ENTRA_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: ENTRA_ENABLED
                  optional: true
            - name: ENTRA_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: ENTRA_TENANT_ID
                  optional: true
            - name: ENTRA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: ENTRA_CLIENT_ID
                  optional: true
            - name: ENTRA_AUTHORITY
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: ENTRA_AUTHORITY
                  optional: true
            - name: ENTRA_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: ENTRA_REDIRECT_URI
                  optional: true
            - name: ENTRA_POST_LOGOUT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: ENTRA_POST_LOGOUT_REDIRECT_URI
                  optional: true
            - name: ENTRA_ALLOWED_OBJECT_IDS
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: ENTRA_ALLOWED_OBJECT_IDS
                  optional: true
            - name: LOCAL_REGISTRATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: LOCAL_REGISTRATION_ENABLED
                  optional: true
            - name: SESSION_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: SESSION_COOKIE_SECURE
                  optional: true
            # Only the client secret, in its own Secret. Optional: without it
            # the backend keeps Microsoft sign-in off and logs why.
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spending-tracker-entra
                  key: ENTRA_CLIENT_SECRET
                  optional: true
          volumeMounts:
            - name: uploads-data
              mountPath: ${UPLOAD_DIR}
            - name: batch-data
              mountPath: /app/batch
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 8
            # Three misses, 10s apart, take the pod out of rotation.
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            # Three misses restart a stuck event loop. This probe does not
            # query Postgres.
            failureThreshold: 3
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data
        - name: batch-data
          persistentVolumeClaim:
            claimName: batch-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
