apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: personal-spending-tracker
    spec:
      restartPolicy: Always
      initContainers:
        - name: batch-dir-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /app/batch/data /app/batch/pdf /app/batch/text
          volumeMounts:
            - name: batch-data
              mountPath: /app/batch
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: ${APP_IMAGE_PULL_POLICY}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: APP_ENV
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_NAME
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: DATABASE_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spending-tracker-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: UPLOAD_DIR
            - name: BATCH_DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: BATCH_DATA_DIR
            - name: BATCH_PDF_SOURCE_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: BATCH_PDF_SOURCE_DIR
            - name: BATCH_TEXT_SOURCE_DIR
              valueFrom:
                configMapKeyRef:
                  name: spending-tracker-config
                  key: BATCH_TEXT_SOURCE_DIR
          volumeMounts:
            - name: uploads-data
              mountPath: ${UPLOAD_DIR}
            - name: batch-data
              mountPath: /app/batch
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            # Batch PDF import can block the single worker for minutes; avoid
            # killing the pod when /health cannot respond within 1s (default).
            failureThreshold: 10
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data
        - name: batch-data
          persistentVolumeClaim:
            claimName: batch-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: personal-spending-tracker
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
