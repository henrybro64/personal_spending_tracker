apiVersion: v1
kind: ConfigMap
metadata:
  name: spending-tracker-config
  namespace: spending-tracker
data:
  APP_ENV: production
  DATABASE_HOST: postgres
  DATABASE_NAME: personal_spending_tracker
  DATABASE_PORT: "5432"
  DATABASE_USER: spending_tracker
  UPLOAD_DIR: /app/uploads
  BATCH_DATA_DIR: /app/batch/data
  BATCH_PDF_SOURCE_DIR: /app/batch/pdf
  BATCH_TEXT_SOURCE_DIR: /app/batch/text
  USD_TWD_EXCHANGE_RATE: "32"
  AUDIT_LOG_RETENTION_DAYS: "365"
  STATEMENT_RETENTION_DAYS: "0"
  # Read by both the backend and the frontend proxy, so keep it in one place.
  PDF_PARSE_TIMEOUT_SECONDS: "120"
  # Microsoft Entra sign-in (#100); see docs/entra-auth.md. Not secret. The
  # client secret lives only in Secret spending-tracker-entra.
  ENTRA_ENABLED: "false"
  ENTRA_TENANT_ID: ""
  ENTRA_CLIENT_ID: ""
  ENTRA_AUTHORITY: ""
  ENTRA_REDIRECT_URI: ""
  ENTRA_POST_LOGOUT_REDIRECT_URI: ""
  ENTRA_ALLOWED_OBJECT_IDS: ""
  LOCAL_REGISTRATION_ENABLED: "true"
  SESSION_COOKIE_SECURE: "false"
